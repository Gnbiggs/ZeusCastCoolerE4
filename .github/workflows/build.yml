name: build

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore ZeusCastEnhanced.sln
      - name: Build
        run: dotnet build ZeusCastEnhanced.sln -c Release --no-restore
